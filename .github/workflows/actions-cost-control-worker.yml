name: Actions cost control worker (call only)
on:
  workflow_call:
    inputs:
      expected_repository:
        required: true
        type: string
permissions:
  actions: write
  contents: read
jobs:
  contain:
    if: github.repository_owner == 'NosytLabs' && github.repository == inputs.expected_repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Stop workflows and clean disposable storage
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """One-time repository-scoped Actions containment. No app code, secrets, or billing writes."""
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          WORKER_PATH = '.github/workflows/actions-cost-control-worker.yml'
          REPORT_NAMES = frozenset({
              'browser-results', 'reliability-browser-results', 'cross-browser-tool-results',
              'first-paint-browser-results', 'verified-static-site', 'tidefall-visual-audit',
              'public-documentation-layout', 'documentation-layout',
          })
          ACTIVE_STATUSES = ('in_progress', 'queued', 'waiting', 'pending', 'requested')


          def validate_scope(repo, expected):
              if repo != expected or not re.fullmatch(r'NosytLabs/[A-Za-z0-9_.-]+', repo):
                  raise ValueError('Refusing a repository outside the exact owner-approved scope')


          def timestamp(value):
              result = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if result.tzinfo is None:
                  raise ValueError('Timestamp must contain timezone')
              return result


          def artifact_targets(items, now):
              """Only older duplicate disposable reports; never Pages, releases, backups or unknowns."""
              known = [item for item in items if item.get('name') in REPORT_NAMES]
              newest = {}
              for item in known:
                  rank = (timestamp(item['created_at']), int(item['id']))
                  newest[item['name']] = max(newest.get(item['name'], rank), rank)
              cutoff = now - timedelta(days=3)
              return [item for item in known
                      if timestamp(item['created_at']) < cutoff
                      and (timestamp(item['created_at']), int(item['id'])) != newest[item['name']]]


          def workflow_targets(items, own_id):
              """Do not change managed security/Pages workflows or the call-only shared worker."""
              return [item for item in items
                      if item.get('state') == 'active'
                      and item.get('path', '').startswith('.github/workflows/')
                      and item['path'] != WORKER_PATH and item['id'] != own_id]


          class API:
              def __init__(self, repo, token):
                  self.base = f'https://api.github.com/repos/{repo}/actions/'
                  self.token = token

              def request(self, method, path):
                  if not re.fullmatch(r'[A-Za-z0-9_/?=&.%-]+', path) or '..' in path:
                      raise ValueError('Unsafe API path')
                  req = urllib.request.Request(self.base + path, method=method, headers={
                      'Authorization': 'Bearer ' + self.token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'NosytLabs-Owner-Requested-Cost-Control',
                  })
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(req, timeout=15) as response:
                              data = response.read()
                              return json.loads(data) if data else None
                      except urllib.error.HTTPError as error:
                          if error.code in (502, 503, 504) and attempt < 2:
                              time.sleep(attempt + 1)
                              continue
                          # Never log headers, credentials or response bodies.
                          raise RuntimeError(f'{method} actions/{path}: HTTP {error.code}') from None
                      except urllib.error.URLError:
                          if attempt < 2:
                              time.sleep(attempt + 1)
                              continue
                          raise RuntimeError(f'{method} actions/{path}: network error') from None

              def all(self, path, key):
                  result = []
                  for page in range(1, 51):
                      sep = '&' if '?' in path else '?'
                      data = self.request('GET', f'{path}{sep}per_page=100&page={page}')
                      batch = data[key]
                      result.extend(batch)
                      if len(batch) < 100:
                          return result
                  raise RuntimeError('Pagination safety limit reached; refusing partial inventory')


          def active_runs(api, own_id):
              result = {}
              for status in ACTIVE_STATUSES:
                  for run in api.all(f'runs?status={status}', 'workflow_runs'):
                      if run['id'] != own_id:
                          result[run['id']] = run
              return list(result.values())


          def contain(api, repo, run_id, now):
              report = {'repository': repo, 'run_id': run_id, 'disabled_workflows': [],
                        'cancel_requested': [], 'deleted_caches': 0, 'cache_bytes_removed': 0,
                        'deleted_artifacts': [], 'artifact_bytes_removed': 0, 'errors': []}
              own = api.request('GET', f'runs/{run_id}')['workflow_id']
              # Stop this helper first; a crash cannot leave an automatic maintenance loop.
              api.request('PUT', f'workflows/{own}/disable')
              report['disabled_workflows'].append({'id': own, 'path': 'self'})
              workflows = api.all('workflows', 'workflows')
              for workflow in workflow_targets(workflows, own):
                  try:
                      api.request('PUT', f"workflows/{int(workflow['id'])}/disable")
                      report['disabled_workflows'].append({'id': workflow['id'], 'path': workflow['path']})
                  except RuntimeError as error:
                      report['errors'].append(str(error))
              remaining = active_runs(api, run_id)
              for run in remaining:
                  try:
                      api.request('POST', f"runs/{int(run['id'])}/cancel")
                      report['cancel_requested'].append(run['id'])
                  except RuntimeError as error:
                      report['errors'].append(str(error))
              for _ in range(3):
                  remaining = active_runs(api, run_id)
                  if not remaining:
                      break
                  time.sleep(2)
              caches = api.all('caches', 'actions_caches')
              artifacts = api.all('artifacts', 'artifacts')
              report['before'] = {'caches': len(caches), 'cache_bytes': sum(c['size_in_bytes'] for c in caches),
                                  'artifacts': len(artifacts), 'artifact_bytes': sum(a['size_in_bytes'] for a in artifacts)}
              print('COST_CONTROL_INVENTORY=' + json.dumps(report['before']), flush=True)
              # Cache contents are rebuildable. Do not race a still-running build.
              if remaining:
                  report['errors'].append('Other runs remain active; storage cleanup skipped')
              else:
                  for cache in caches:
                      try:
                          api.request('DELETE', f"caches/{int(cache['id'])}")
                          report['deleted_caches'] += 1
                          report['cache_bytes_removed'] += cache['size_in_bytes']
                      except RuntimeError as error:
                          report['errors'].append(str(error))
                  run_states = {}
                  for artifact in artifact_targets(artifacts, now):
                      source_run = artifact.get('workflow_run', {}).get('id')
                      if not source_run:
                          continue
                      try:
                          if source_run not in run_states:
                              run_states[source_run] = api.request('GET', f'runs/{int(source_run)}')['status']
                          if run_states[source_run] != 'completed':
                              continue
                          api.request('DELETE', f"artifacts/{int(artifact['id'])}")
                          report['deleted_artifacts'].append({'id': artifact['id'], 'name': artifact['name']})
                          report['artifact_bytes_removed'] += artifact['size_in_bytes']
                      except RuntimeError as error:
                          report['errors'].append(str(error))
              after_workflows = api.all('workflows', 'workflows')
              report['active_repository_workflows'] = [w['id'] for w in workflow_targets(after_workflows, own)]
              report['self_disabled'] = api.request('GET', f'workflows/{own}')['state'] == 'disabled_manually'
              report['remaining_active_runs'] = [r['id'] for r in active_runs(api, run_id)]
              after_caches = api.all('caches', 'actions_caches')
              after_artifacts = api.all('artifacts', 'artifacts')
              report['after'] = {'caches': len(after_caches), 'cache_bytes': sum(c['size_in_bytes'] for c in after_caches),
                                 'artifacts': len(after_artifacts), 'artifact_bytes': sum(a['size_in_bytes'] for a in after_artifacts)}
              report['preserved_managed_workflows'] = [w['path'] for w in after_workflows
                                                     if w['state'] == 'active' and not w['path'].startswith('.github/workflows/')]
              report['verified'] = not (report['errors'] or report['active_repository_workflows'] or
                                        report['remaining_active_runs'] or not report['self_disabled'])
              return report


          def main():
              repo = os.environ['GITHUB_REPOSITORY']
              validate_scope(repo, os.environ['EXPECTED_REPOSITORY'])
              if os.environ.get('GITHUB_EVENT_NAME') not in ('push', 'workflow_dispatch'):
                  raise ValueError('Only the owner-requested push or manual invocation is allowed')
              api = API(repo, os.environ['GH_TOKEN'])
              report = contain(api, repo, int(os.environ['GITHUB_RUN_ID']), datetime.now(timezone.utc))
              print('COST_CONTROL_RESULT=' + json.dumps(report, separators=(',', ':')), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('# One-time Actions cost containment\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
              if not report['verified']:
                  raise SystemExit('Containment has unresolved items; see the report. No automatic retry is configured.')


          if __name__ == '__main__':
              main()
          PYCODE
