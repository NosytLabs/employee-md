name: One-time repository hygiene
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-hygiene-20260920.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: read
concurrency:
  group: owner-requested-repository-hygiene
  cancel-in-progress: false
jobs:
  clean:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: run requested repository hygiene'
    uses: NosytLabs/employee-md/.github/workflows/repository-hygiene-worker.yml@f184d21af140ac81323e87a098f32735c3750793
    with:
      expected_repository: NosytLabs/employee-md
