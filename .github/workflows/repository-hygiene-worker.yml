name: Repository hygiene worker (call only)
on:
  workflow_call:
    inputs:
      expected_repository:
        required: true
        type: string
permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: read
jobs:
  hygiene:
    if: github.repository_owner == 'NosytLabs' && github.repository == inputs.expected_repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable maintenance code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NosytLabs/employee-md
          ref: b763bf2545bfbd12af6c0cd94a415bc8b15cefe1
          path: maintenance
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Audit and clean old repository records
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
        run: python3 maintenance/.github/scripts/repository_hygiene.py
