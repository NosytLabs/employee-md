name: One-time repository hygiene
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-hygiene-20260920-v2.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: read
concurrency:
  group: owner-requested-repository-hygiene
  cancel-in-progress: false
jobs:
  clean:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: run requested repository hygiene'
    uses: NosytLabs/employee-md/.github/workflows/repository-hygiene-worker.yml@c3ce688962f3640e3778e8f3ed56ff8a76a15898
    with:
      expected_repository: NosytLabs/employee-md
